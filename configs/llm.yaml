default_profile: fast

profiles:
  dev:
    backend: placeholder
    device: cpu

  fast:
    backend: nllb
    model_name: facebook/nllb-200-distilled-600M
    device: cuda
    # RTX 5080 / 64GB RAM: можно выше батч для скорости; если поймаешь OOM — снизь до 8/12.
    batch_size: 16
    max_length: 640
    source_lang: en
    target_lang: ru

  full:
    backend: nllb
    model_name: facebook/nllb-200-distilled-1.3B
    device: cpu
    batch_size: 4
    max_length: 640
    source_lang: en
    target_lang: ru
